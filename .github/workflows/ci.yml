name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 质量检查：复用本地 ci.mjs（install → format → type-check → lint → build）
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/ci.mjs
