# CD：全自动部署到服务器（无需服务器上的 deploy.sh / pnpm / 代码仓库）
# 流程：在 GitHub runner 上构建 → rsync 前端/后端产物到服务器 → SSH 重启服务
# 触发：push 到 main 或 PR 合并到 main 后自动执行；也可在 Actions 页手动触发（workflow_dispatch）
#
# 前置：
#  1) 服务器一次性初始化：安装 Node(运行)、nginx、rsync，并部署
#     deploy/ez-english.service 与 deploy/nginx.conf（见 README「部署」）
#  2) GitHub Secrets：SERVER_SSH_KEY / SERVER_HOST / SERVER_USER / SERVER_PORT
#  3) 登录用户需免密 sudo（rsync --rsync-path="sudo rsync"、systemctl restart 都需要）
name: Deploy

on:
  # push 到 main 直接部署
  push:
    branches: [main]
  # PR 合并到 main 后部署
  pull_request:
    types: [closed]
    branches: [main]
  # 手动触发
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.merged == true }}
    env:
      WEB_DIR: /var/www/ez-english/dist
      SERVER_DIR: /opt/ez-english/server
      SERVICE_NAME: ez-english
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 shared → client → server
        env:
          # 前端 API 地址由 GitHub Actions 变量控制（仓库 → Settings → Secrets and variables → Actions → Variables）
          # 生产建议填 /api（Nginx 同源反代，无需端口）；未设置时默认 /api
          VITE_API_BASE: ${{ vars.VITE_API_BASE || '/api' }}
        run: |
          pnpm --filter @ez-english/shared build
          pnpm --filter client build
          pnpm --filter server build

      - name: 准备后端部署产物（含生产依赖，不含 dev 依赖）
        run: |
          rm -rf .deploy/server
          pnpm --filter server deploy --prod .deploy/server
          cp -r server/dist .deploy/server/dist

      - name: 安装 rsync 并配置 SSH 密钥
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 部署前端到 ${{ env.WEB_DIR }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" "sudo mkdir -p $WEB_DIR"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${SERVER_PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --rsync-path="sudo rsync" \
            client/dist/ "$SERVER_USER@$SERVER_HOST:$WEB_DIR/"

      - name: 部署后端到 ${{ env.SERVER_DIR }}（--exclude data 保护 SQLite 数据）
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" "sudo mkdir -p $SERVER_DIR"
          rsync -az --delete --exclude data \
            -e "ssh -i ~/.ssh/deploy_key -p ${SERVER_PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --rsync-path="sudo rsync" \
            .deploy/server/ "$SERVER_USER@$SERVER_HOST:$SERVER_DIR/"

      - name: 重启后端服务并重载 Nginx
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" \
            "sudo systemctl restart $SERVICE_NAME && sudo nginx -t && sudo systemctl reload nginx"
