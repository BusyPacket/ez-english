# ez-english Nginx 站点配置
# 安装：sudo cp deploy/nginx.conf /etc/nginx/sites-available/ez-english
#        sudo ln -s /etc/nginx/sites-available/ez-english /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# 按需修改：server_name（域名或 IP）
server {
    listen 80;
    server_name _;   # 换成你的域名或 IP，如 example.com

    # 前端部署目录（GitHub Actions 会把 client/dist 同步到这里）
    root /var/www/ez-english/dist;
    index index.html;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（端口与 ez-english.service 一致）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
